<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Urikem Legal demosu: UYAP verisiyle çalışan avukat asistanı. Bu sayfadaki bütün kişi, şirket, dosya numarası ve tutarlar uydurmadır.">
<title>Urikem Legal — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="ust">
  <div class="marka"><span class="logo" aria-hidden="true">§</span><span>Urikem Legal</span></div>
  <form class="sorgu ust-sorgu" id="ust-sorgu" data-form="sorgu" role="search">
    <label for="ust-q" class="gizli">Dosyalarınıza soru sorun</label>
    <input id="ust-q" name="q" autocomplete="off" placeholder="Sorun: yarın ne var, avansı biten müvekkiller…">
  </form>
  <div class="ust-sag">
    <div class="anahtar-grup" role="group" aria-label="Görünüm">
      <button data-gorunum="avukat">Avukat</button>
      <button data-gorunum="portal">Müvekkil portalı</button>
    </div>
    <div class="anahtar-grup" id="mod-kutu" role="group" aria-label="Veri kaynağı" hidden>
      <button data-mod="canli">UYAP verisi</button>
      <button data-mod="demo">Demo</button>
    </div>
  </div>
</header>
<div id="bant"></div>
<div class="govde">
  <nav class="menu" aria-label="Bölümler">
    <button data-sayfa="ozet">Özet</button>
    <button data-sayfa="durusma">Duruşmalar</button>
    <button data-sayfa="evrak">Evrak ve tebligat <span class="sayac" hidden></span></button>
    <button data-sayfa="muvekkil">Müvekkiller</button>
    <button data-sayfa="dosya">Dosyalar</button>
    <button data-sayfa="para">Masraf ve avans <span class="sayac" hidden></span></button>
    <button data-sayfa="dilekce">Dilekçe</button>
    <button data-sayfa="gorusme">Görüşmeler <span class="sayac" hidden></span></button>
    <button data-sayfa="hatirlatma">Hatırlatmalar</button>
    <div class="menu-alt" id="senkron"></div>
  </nav>
  <main id="icerik"></main>
</div>
<div id="kaplama" hidden></div>
<div id="bildirim" role="status" hidden></div>
<script>window.URIKEM_DEMO = true;</script>
<script src="karti-sure.js"></script>
<script src="veri.js"></script>
<script src="sorgu.js"></script>
<script src="anonim.js"></script>
<script src="demo.js"></script>
<script src="panel.js"></script>

</body>
</html>
